<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chicago restaurant inspections Gold warehouse</title>
  <desc id="desc">One inspection fact table connects to date, location, and optional license-record dimensions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EAF2FC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1510" cy="20" r="210" fill="#DCEAFF" opacity=".65"/>
  <text x="80" y="75" fill="#285FD2" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="3">GOLD WAREHOUSE</text>
  <text x="80" y="158" fill="#14243B" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="750">One fact. Three dimensions.</text>
  <text x="80" y="223" fill="#53647D" font-family="Segoe UI,Arial,sans-serif" font-size="31">Every inspection stays in the fact table, even without a license match</text>

  <path d="M250 500 V552 H600 V585" fill="none" stroke="#5E8FEA" stroke-width="4"/>
  <path d="M800 500 V585" fill="none" stroke="#21A99E" stroke-width="4"/>
  <path d="M1350 500 V552 H1000 V585" fill="none" stroke="#8B6ADC" stroke-width="4"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="80" y="330" width="340" height="170" rx="22" fill="#FFFFFF" stroke="#BFD2F5" stroke-width="3"/>
    <text x="110" y="398" fill="#245FC7" font-size="34" font-weight="750">dim_date</text>
    <text x="110" y="453" fill="#53647D" font-size="25">When?</text>

    <rect x="630" y="330" width="340" height="170" rx="22" fill="#FFFFFF" stroke="#BCE5DF" stroke-width="3"/>
    <text x="660" y="398" fill="#128F7D" font-size="34" font-weight="750">dim_location</text>
    <text x="660" y="453" fill="#53647D" font-size="25">Where?</text>

    <rect x="1180" y="330" width="340" height="170" rx="22" fill="#FFFFFF" stroke="#D8CBF7" stroke-width="3"/>
    <text x="1210" y="398" fill="#7658C8" font-size="30" font-weight="750">dim_license_record</text>
    <text x="1210" y="453" fill="#53647D" font-size="25">Which license?</text>

    <rect x="455" y="585" width="690" height="198" rx="25" fill="#193B72"/>
    <text x="800" y="656" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="750">fact_inspections</text>
    <text x="800" y="707" text-anchor="middle" fill="#DCE8FF" font-size="27">One row per inspection • 13,864 rows</text>
    <text x="800" y="749" text-anchor="middle" fill="#DCE8FF" font-size="24">result  •  risk  •  inspection type</text>

    <text x="80" y="854" fill="#7A8BA1" font-size="20">11,303 inspections matched a license record  •  2,561 were retained without a match</text>
  </g>
</svg>
