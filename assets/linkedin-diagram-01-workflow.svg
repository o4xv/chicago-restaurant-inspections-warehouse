<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chicago restaurant inspections project workflow</title>
  <desc id="desc">Chicago APIs flow through Python, Snowflake, and dbt. Tool logos identify the three main technologies.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#8294A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .ink { fill: #172B43; }
    .muted { fill: #586B80; }
    .blue { fill: #2864A6; }
    .step { font-size: 20px; font-weight: 700; letter-spacing: 1.5px; }
    .name { font-size: 35px; font-weight: 700; }
    .detail { font-size: 24px; }
  </style>

  <text x="80" y="91" class="blue" font-size="23" font-weight="700" letter-spacing="2">DATA ENGINEERING PROJECT</text>
  <text x="80" y="175" class="ink" font-size="62" font-weight="700">Chicago restaurant inspections</text>
  <text x="80" y="232" class="muted" font-size="30">From two public APIs to an analysis-ready warehouse</text>

  <path d="M425 458 H445" fill="none" stroke="#8294A7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M797 458 H817" fill="none" stroke="#8294A7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1169 458 H1189" fill="none" stroke="#8294A7" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="80" y="338" width="340" height="240" rx="14" fill="#FFFFFF" stroke="#D4DEE8" stroke-width="2"/>
    <text x="108" y="392" class="blue step">SOURCE</text>
    <text x="108" y="465" class="ink name">Chicago APIs</text>
    <text x="108" y="518" class="muted detail">Inspections +</text>
    <text x="108" y="549" class="muted detail">business licenses</text>

    <rect x="452" y="338" width="340" height="240" rx="14" fill="#FFFFFF" stroke="#D4DEE8" stroke-width="2"/>
    <text x="480" y="392" class="blue step">EXTRACT</text>
    <image href="logos/python-logo-only.svg" x="699" y="361" width="60" height="62" preserveAspectRatio="xMidYMid meet"/>
    <text x="480" y="465" class="ink name">Python</text>
    <text x="480" y="518" class="muted detail">requests + pagination</text>
    <text x="480" y="549" class="muted detail">JSONL snapshot</text>

    <rect x="824" y="338" width="340" height="240" rx="14" fill="#FFFFFF" stroke="#D4DEE8" stroke-width="2"/>
    <text x="852" y="392" class="blue step">LOAD</text>
    <image href="logos/snowflake-icon.png" x="1060" y="360" width="72" height="67" preserveAspectRatio="xMidYMid meet"/>
    <text x="852" y="465" class="ink name">Snowflake</text>
    <text x="852" y="518" class="muted detail">Bronze tables</text>
    <text x="852" y="549" class="muted detail">Raw JSON</text>

    <rect x="1196" y="338" width="340" height="240" rx="14" fill="#FFFFFF" stroke="#D4DEE8" stroke-width="2"/>
    <text x="1224" y="392" class="blue step">TRANSFORM</text>
    <image href="logos/dbt-logo-full.svg" x="1395" y="367" width="118" height="48" preserveAspectRatio="xMidYMid meet"/>
    <text x="1224" y="465" class="ink name">dbt Core</text>
    <text x="1224" y="518" class="muted detail">Silver + Gold models</text>
    <text x="1224" y="549" class="muted detail">SQL analysis</text>
  </g>

  <line x1="80" y1="672" x2="1536" y2="672" stroke="#CDD8E3" stroke-width="2"/>
  <text x="80" y="741" class="ink" font-size="30" font-weight="600">2025 snapshot</text>
  <circle cx="423" cy="731" r="4" fill="#8294A7"/>
  <text x="466" y="741" class="ink" font-size="30" font-weight="600">13,864 inspections</text>
  <circle cx="891" cy="731" r="4" fill="#8294A7"/>
  <text x="935" y="741" class="ink" font-size="30" font-weight="600">17,830 license records</text>

</svg>
