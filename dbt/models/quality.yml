version: 2

models:
  - name: stg_inspections
    columns:
      - name: inspection_id
        data_tests:
          - not_null
          - unique
      - name: inspection_date
        data_tests:
          - not_null

  - name: stg_business_licenses
    columns:
      - name: license_record_id
        data_tests:
          - not_null
          - unique
      - name: license_number
        data_tests:
          - not_null
      - name: license_start_date
        data_tests:
          - not_null
      - name: expiration_date
        data_tests:
          - not_null

  - name: inspection_license_links
    columns:
      - name: inspection_id
        data_tests:
          - not_null
          - unique
      - name: license_record_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_business_licenses')
                field: license_record_id

  - name: dim_date
    columns:
      - name: date_day
        data_tests:
          - not_null
          - unique

  - name: dim_location
    columns:
      - name: location_key
        data_tests:
          - not_null
          - unique

  - name: dim_license_record
    columns:
      - name: license_record_id
        data_tests:
          - not_null
          - unique

  - name: fact_inspections
    columns:
      - name: inspection_id
        data_tests:
          - not_null
          - unique
      - name: inspection_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: location_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: license_record_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_license_record')
                field: license_record_id
